[package]
name = "lite-mc-ping"
version = "0.1.1"
edition = "2024"
description = "Minimal async Minecraft Java Edition (1.7+) server list ping with SRV resolution and optional latency measurement"
license = "MIT"
authors = ["tangge233 <tangge233@qq.com>"]
repository = "https://github.com/tangge233/lite-mc-ping"
keywords = ["minecraft", "ping", "server-list-ping"]
categories = ["network-programming"]

[dependencies]
hickory-resolver = "0.26"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "time"] }
varint = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "ping"
path = "examples/ping.rs"
